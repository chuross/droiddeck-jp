name: Build and publish ARM64 Proton DroidDeck patches

on:
  push:
    branches: [main]
    paths: ['overlay/proton-ntcontext/**', 'tests/test_proton_ntcontext.py', '.github/workflows/proton.yml']
  workflow_dispatch:
  schedule:
    - cron: '47 0 * * *'

permissions:
  contents: read

concurrency:
  group: jp-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Helper and automation tests
        run: python3 -m unittest discover -s tests -v
      - name: Discover latest stable ARM64 ProtonGE release
        id: plan
        run: >-
          python3 overlay/proton-ntcontext/release.py plan
          --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proton-release-plan
          path: |
            proton-release-plan.json
            candidate-proton.lock.json
      - name: Build dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git make rsync curl patch autoconf automake libtool nasm meson ninja-build cmake
          docker info
          df -h "$GITHUB_WORKSPACE"
      - name: Rebuild patched ARM64X ntdll and DXVK DXGI and package Proton
        if: steps.plan.outputs.build == 'true'
        run: bash overlay/proton-ntcontext/build.sh candidate-proton.lock.json
      - name: Attach Proton to current DroidDeck Release and record tested GE version
        if: steps.plan.outputs.build == 'true'
        run: >-
          python3 overlay/proton-ntcontext/release.py publish
          --repository "$GITHUB_REPOSITORY" --manager "$GITHUB_SHA"
      - name: Save build logs
        if: always() && steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proton-build-logs
          path: |
            build/proton-ntcontext/results/
            build/proton-ntcontext/wine-build/config.log
            build/proton-ntcontext/dxvk-build/meson-logs/
            build/proton-ntcontext/sdk-digests.json
          if-no-files-found: ignore
      - name: Remove temporary build source
        if: always()
        run: rm -rf build/proton-ntcontext
