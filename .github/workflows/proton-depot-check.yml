name: Check official Steam ARM64 Experimental download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/proton-depot-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download with Valve SteamCMD using anonymous access
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd"
          cd "$RUNNER_TEMP/steamcmd"
          curl -fL --retry 3 https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o steamcmd.tar.gz
          tar -xzf steamcmd.tar.gz
          set +e
          timeout 20m ./steamcmd.sh +login anonymous +app_info_update 1 +app_info_print 4427310 +download_depot 4427310 4427311 +quit 2>&1 | tee download.log
          result=${PIPESTATUS[0]}
          set -e
          echo "SteamCMD exit: $result"
          test "$result" -eq 0
          test -s steamapps/content/app_4427310/depot_4427311/version
          cat steamapps/content/app_4427310/depot_4427311/version
