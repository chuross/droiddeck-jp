name: Build and publish temporary DD-Turnip heap usage patch

on:
  push:
    branches: [main]
    paths:
      - 'overlay/turnip-process-heap-usage/**'
      - '.github/workflows/turnip.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * *'

permissions:
  contents: read

concurrency:
  group: patched-dd-turnip-${{ github.repository }}
  cancel-in-progress: false

jobs:
  driver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Overlay and removal tests
        run: python3 -m unittest discover -s tests -v
      - name: Resolve official stable recipe and Mesa; detect equivalent upstream fixes
        id: plan
        run: python3 overlay/turnip-process-heap-usage/driver.py plan --repository "$GITHUB_REPOSITORY"
      - name: Host build tools
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build flex bison glslang-tools pkg-config python3-pip binutils gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu libwayland-dev
          python3 -m pip install 'meson>=1.5' mako pyyaml packaging
      - name: Android NDK from the exact official recipe
        if: steps.plan.outputs.build == 'true'
        id: ndk
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: ${{ steps.plan.outputs.ndk_version }}
          add-to-path: false
          local-cache: true
      - name: Build official Android and Linux targets with the temporary patch
        if: steps.plan.outputs.build == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash overlay/turnip-process-heap-usage/build.sh
      - name: Publish DD-Turnip only; preserve Latest APK release
        if: steps.plan.outputs.build == 'true'
        run: python3 overlay/turnip-process-heap-usage/release.py --repository "$GITHUB_REPOSITORY" --manager "$GITHUB_SHA"
      - name: Preserve plan and patch logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turnip-plan-and-logs
          path: |
            build/turnip-process-heap-usage/plan.json
            build/turnip-process-heap-usage/drivers/work/*/patch.log
          if-no-files-found: ignore
